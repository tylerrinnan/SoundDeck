name: CI

# PR gate: tests + type check must pass before merge.
# Also exposed as a reusable workflow so the release pipeline reuses the exact
# same gate (release.yml calls this before building).
on:
  pull_request:
    branches: [main]
  workflow_call:

# Cancel superseded runs for the same PR/branch to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows-only app: hotkeys.py loads ctypes.windll.user32 at import, and
    # the suite imports pycaw/pywin32. Must run on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyright

      - name: Type check (pyright)
        run: python -m pyright

      - name: Run tests (pytest)
        run: python -m pytest
