name: CI

# PR gate: tests + type check must pass before merge.
# Also exposed as a reusable workflow so the release pipeline reuses the exact
# same gate (release.yml calls this before building).
on:
  pull_request:
    branches: [main]
  workflow_call:

# Cancel superseded runs for the same PR/branch to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows-only app: hotkeys.py loads ctypes.windll.user32 at import, and
    # the suite imports pycaw/pywin32. Must run on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyright

      - name: Type check (pyright)
        run: python -m pyright

      - name: Run tests with coverage
        # Coverage scope + omit live in pyproject.toml ([tool.coverage.run]).
        # Build fails if coverage of the unit-testable surface drops below 95%.
        run: >
          python -m pytest
          --cov=.
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=95

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .coverage) {
            "## Coverage" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            python -m coverage report --format=markdown | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
