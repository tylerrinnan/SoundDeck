name: Release

# Runs on every merge to main (i.e. after a PR lands). Re-runs the full CI gate
# first, then builds the frozen exe and publishes a GitHub Release.
# Escape hatch: put [skip release] in the merge commit message to build/test
# only without cutting a release. Manual runs are allowed via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create tags + releases with the default GITHUB_TOKEN.
permissions:
  contents: write

# Never run two releases at once (avoids tag/version races).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reuse the exact PR gate so we never release something that failed tests.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full tag history to compute the next version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build executable (PyInstaller)
        # SoundDeck.spec is gitignored (*.spec), so it isn't in the checkout.
        # Use the same explicit invocation as build.bat instead.
        run: >
          python -m PyInstaller --onedir --windowed --name SoundDeck
          --icon=sounddeck.ico
          --hidden-import=pycaw --hidden-import=pycaw.pycaw
          --hidden-import=pycaw.api.mmdeviceapi --hidden-import=pycaw.constants
          --hidden-import=comtypes --hidden-import=comtypes.client
          --hidden-import=pystray._win32 --hidden-import=PIL
          --collect-all=pycaw --collect-all=comtypes
          main.py

      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag -l "v*.*.*"
          if ($tags) {
            $latest = $tags | Sort-Object { [version]($_ -replace '^v','') } | Select-Object -Last 1
            $v = [version]($latest -replace '^v','')
            $next = "v{0}.{1}.{2}" -f $v.Major, $v.Minor, ($v.Build + 1)
          } else {
            $next = "v1.0.0"
          }
          Write-Host "Next version: $next"
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package release archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path dist/SoundDeck -DestinationPath "SoundDeck-$env:VERSION-win64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Auto-generated "What's Changed" changelog (same content --generate-notes produces).
          $changelog = gh api "repos/$env:REPO/releases/generate-notes" `
            -f tag_name="$env:VERSION" -f target_commitish="$env:SHA" --jq ".body"
          # Prepend install instructions from the committed template (--generate-notes omits them).
          $install = (Get-Content ".github/release_body_template.md" -Raw).Replace("__VERSION__", $env:VERSION)
          Set-Content -Path "release-notes.md" -Value ($install + $changelog) -Encoding utf8
          gh release create "$env:VERSION" "SoundDeck-$env:VERSION-win64.zip" `
            --title "SoundDeck $env:VERSION" --target "$env:SHA" --notes-file "release-notes.md"
